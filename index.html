<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Worksheets</title>
    <link rel="icon" href="icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="theme-color" content="#1e1e2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Worksheets</h1>
        <div class="actions">
            <button id="update-btn" type="button" hidden>Update</button>
            <button id="sync-btn" type="button">Sign in to sync</button>
            <button id="courses-btn" type="button">Courses</button>
            <button id="export-btn" type="button" title="Tasks, courses and problem sheets">Export</button>
            <button id="export-all-btn" type="button" title="Everything, including submissions, marked work and course notes">Export all</button>
            <button id="import-btn" type="button">Import</button>
            <input id="import-file" type="file" accept=".todo,.json,application/json" hidden>
        </div>
    </header>
    <div id="message" hidden></div>
    <form id="add-form">
        <select id="task-course" title="Course" required></select>
        <input id="task-sheet" type="text" inputmode="numeric" placeholder="Sheet no." title="Sheet number" required>
        <input id="task-due" type="date" required>
        <input id="task-time" type="time" title="Submission time" required>
        <button type="submit">Add</button>
    </form>
    <section>
        <h2>Incomplete <span class="count" id="count-incomplete"></span></h2>
        <ul class="task-list" id="list-incomplete"></ul>
    </section>
    <section>
        <h2>Completed <span class="count" id="count-complete"></span></h2>
        <ul class="task-list" id="list-complete"></ul>
    </section>
    <section>
        <h2>Submitted <span class="count" id="count-submitted"></span></h2>
        <ul class="task-list" id="list-submitted"></ul>
    </section>
    <div id="selection-bar" hidden>
        <span id="selection-text"></span>
        <button id="draft-email-btn" type="button">✉ Draft email</button>
        <button id="draft-combined-btn" type="button" hidden title="Merge the submissions into one PDF and email that">✉ Draft as combined</button>
        <button id="clear-selection-btn" class="secondary" type="button">Clear</button>
    </div>
    <div id="courses-modal" class="modal" hidden>
        <div class="modal-box">
            <div class="modal-head">
                <h2>Courses</h2>
                <button id="courses-close" type="button">Close</button>
            </div>
            <ul id="course-list"></ul>
            <form id="course-form">
                <input id="course-name" type="text" placeholder="Course name" required>
                <input id="course-tutor" type="text" placeholder="Tutor name" required>
                <input id="course-email" type="email" placeholder="Tutor email" required>
                <button type="submit">Add course</button>
                <textarea id="course-notes" rows="2" placeholder="Submission notes, e.g. upload to Moodle, print and hand in…"></textarea>
                <input id="course-format" class="course-format" type="text" placeholder="Submission file name (optional), e.g. Xavier_Howard_IntroCalculus_{sheet}.pdf" title="{sheet} is replaced with the sheet number">
                <div id="course-format-preview" class="format-preview"></div>
            </form>
        </div>
    </div>
    <div id="sync-modal" class="modal" hidden>
        <div class="modal-box sync-box">
            <div class="modal-head">
                <h2 id="sync-title">Sign in to sync</h2>
                <button id="sync-close" type="button">Close</button>
            </div>
            <form id="email-form">
                <p>Keep your tasks, courses and PDFs in sync across your devices. Enter your email and we'll send you a sign-in code. No password needed.</p>
                <input id="sync-email" type="email" placeholder="Email address" autocomplete="email" required>
                <button type="submit">Send code</button>
            </form>
            <form id="code-form" hidden>
                <p id="code-sent"></p>
                <div id="code-boxes" role="group" aria-label="Sign-in code"></div>
                <button type="submit">Sign in</button>
                <button id="code-back" class="secondary" type="button">Use a different email</button>
            </form>
            <div id="account" hidden>
                <p>Signed in as <strong id="account-email"></strong></p>
                <p id="account-status" class="muted"></p>
                <button id="sign-out" class="secondary" type="button">Sign out</button>
                <button id="sign-out-clear" class="secondary danger" type="button">Sign out and remove data from this computer</button>
            </div>
            <p id="sync-error" hidden></p>
        </div>
    </div>
    <script src="node_modules/@supabase/supabase-js/dist/umd/supabase.js"></script>
    <script src="mobile.js"></script>
    <script src="web.js"></script>
    <script src="sync.js"></script>
    <script src="script.js"></script>
    <script src="claude.js"></script>
</body>
</html>
